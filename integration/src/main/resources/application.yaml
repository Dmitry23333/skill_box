server:
  port: 8082
spring:
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    generate-ddl: true
  datasource:
    url: jdbc:postgresql://localhost:5432/integration_db
    username: postgres
    password: postgres
    hikari:
      schema: integration_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS integration_schema
      connection-timeout: 10000
app:
  cache:
    cache-names:
      - booksByCategory
      - bookById
      - byAuthorAndTitle
    caches:
      booksByCategory:
        expiry: 300s

      bookById:
        expiry: 300s

      byAuthorAndTitle:
        expiry: 300s

